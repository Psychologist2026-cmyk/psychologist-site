<header class="header">

  <button class="menu-btn" id="menuBtn" type="button" aria-label="Меню"><span></span><span></span><span></span></button>
  <nav class="nav" id="nav">

<main>

<section class="section page-hero"><p class="eyebrow">Послуги</p><h1>Оберіть консультацію</h1></section>
<section class="section compact-top"><div class="cards" id="servicesGrid"></div></section>
<section class="section booking-section" id="booking">
  <div class="section-head reveal"><p class="eyebrow">Запис</p><h2>Бронювання консультації</h2></div>
  <div class="booking-layout">
    <form id="bookingForm" class="booking-box reveal">
      <div class="booking-steps"><span class="active">Дані</span><span>Підтвердження</span><span>Оплата</span><span>Zoom</span></div>
      <input id="clientFullName" placeholder="ПІБ" required>
      <input id="clientEmail" type="email" placeholder="Email" required>
      <input id="clientPhone" placeholder="Номер телефону" required>
      <input id="clientSocial" placeholder="Соцмережа для звʼязку">
      <select id="bookingService" required><option value="">Оберіть консультацію</option></select>
      <input id="bookingDate" type="date" required>
      <select id="bookingTime" required><option value="">Спочатку оберіть дату</option></select>
      <textarea id="clientComment" placeholder="Коментар або короткий запит"></textarea>
      <button class="btn primary full" type="submit">Підтвердити запис</button>
    </form>
    <aside class="booking-summary reveal"><h3>Деталі</h3><div class="booking-result" id="bookingResult"></div></aside>
  </div>
</section>

</main>
