<section class="section compact-top auth-grid">
  <div class="login-card reveal">
    <h2>Клієнт</h2>
    <form id="clientAuthForm">
      <input id="clientAuthName" placeholder="Ваше імʼя">
      <input id="clientAuthEmail" type="email" placeholder="Email" required>
      <input id="clientAuthPassword" type="password" placeholder="Пароль" required>
      <button class="btn primary full" type="submit">Увійти / Зареєструватись</button>
      <button class="btn secondary full" type="button" id="googleClientBtn">Google</button>
    </form>
  </div>
  <div class="login-card reveal">
    <h2>Психолог</h2>
    <form id="ownerAuthForm">
      <input id="ownerEmail" type="email" placeholder="Email" required>
      <input id="ownerPassword" type="password" placeholder="Пароль" required>
      <button class="btn primary full" type="submit">Увійти</button>
    </form>
  </div>
</section>
